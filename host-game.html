<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Host a Live Game — SAFe SM Quiz</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap');
  :root{--bg:#1a1a2e;--surface:#16213e;--card:#0f3460;--accent:#e94560;--yellow:#f5a623;--green:#2ecc71;--red:#e74c3c;--muted:#a0aec0;--white:#fff;--gold:#ffd700;--silver:#c0c0c0;--bronze:#cd7f32;--a:#e21b3c;--b:#1368ce;--c:#26890c;--d:#ffa602}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Nunito Sans',sans-serif;background:var(--bg);color:#fff;min-height:100vh;overflow-x:hidden}
  h1,h2,h3,.n{font-family:'Nunito',sans-serif}
  .screen{display:none;min-height:100vh}
  .screen.active{display:flex;flex-direction:column}
  .btn{display:inline-block;padding:.85rem 2rem;border-radius:50px;border:none;cursor:pointer;font-family:'Nunito';font-weight:800;font-size:1rem;transition:all .15s;margin:.25rem;text-decoration:none;color:#fff}
  .btn:hover{transform:scale(1.04)}
  .btn-primary{background:var(--accent)}
  .btn-secondary{background:var(--surface);border:2px solid rgba(255,255,255,.2)}
  .btn-yellow{background:var(--yellow);color:#1a1a2e}
  .btn-green{background:var(--green)}
  .setup-warn{max-width:560px;margin:2rem auto;background:rgba(233,69,96,.12);border:1px solid var(--accent);border-radius:14px;padding:1.25rem 1.5rem;color:#ffd7de;font-size:.9rem;line-height:1.6}
  .setup-warn code{background:rgba(0,0,0,.3);padding:.1rem .4rem;border-radius:4px}
  .toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(90px);background:var(--card);padding:.75rem 1.5rem;border-radius:10px;font-weight:700;font-size:.9rem;transition:transform .3s;z-index:999;border-left:4px solid var(--green)}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
  @media(max-width:560px){.tiles{grid-template-columns:1fr 1fr}}
  .tile{display:flex;align-items:center;gap:1rem;padding:1.2rem 1.4rem;border-radius:14px;border:none;color:#fff;font-family:'Nunito';font-weight:800;font-size:1.05rem;text-align:left;cursor:pointer;transition:all .12s;min-height:84px;word-break:break-word}
  .tile:hover:not(:disabled){filter:brightness(1.08);transform:scale(1.01)}
  .tile:disabled{cursor:default}
  .tile.A{background:var(--a)}.tile.B{background:var(--b)}.tile.C{background:var(--c)}.tile.D{background:var(--d);color:#1a1a2e}
  .tile .sh{width:40px;height:40px;flex-shrink:0;border-radius:8px;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:900}
  .tile.dim{opacity:.35}
  .tile.right{outline:5px solid var(--green);filter:brightness(1.12)}

  #screen-setup{align-items:center;justify-content:center;padding:2rem;text-align:center;background:linear-gradient(135deg,#1a1a2e,#0f3460)}
  .badge{background:var(--accent);color:#fff;font-family:'Nunito';font-weight:900;font-size:.8rem;padding:.35rem 1rem;border-radius:20px;display:inline-block;margin-bottom:1.25rem;letter-spacing:2px;text-transform:uppercase}
  h1.big{font-size:clamp(1.8rem,5vw,2.8rem);font-weight:900;margin-bottom:.4rem}
  .sub{color:var(--muted);margin-bottom:2rem}
  .pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:.8rem;max-width:760px;margin:0 auto 1.5rem}
  .pcard{background:var(--surface);border:2px solid transparent;border-radius:14px;padding:1.1rem;cursor:pointer;text-align:left;transition:all .15s;position:relative;overflow:hidden}
  .pcard::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--pc)}
  .pcard:hover{transform:translateY(-3px);background:var(--card);border-color:rgba(255,255,255,.2)}
  .pcard.sel{border-color:var(--pc);background:var(--card)}
  .pc-n{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--pc);margin-bottom:.4rem}
  .pc-t{font-family:'Nunito';font-weight:800;font-size:1rem;line-height:1.3}
  .pc-m{font-size:.78rem;color:var(--muted);margin-top:.35rem}

  #screen-lobby{padding:1.5rem;background:radial-gradient(ellipse at top,#243b6b,#0e1428 60%)}
  .lobby-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;max-width:1100px;margin:0 auto 1.5rem}
  .join-box{background:var(--surface);border-radius:18px;padding:1.5rem 2rem;display:flex;gap:2rem;align-items:center;flex-wrap:wrap;justify-content:center}
  .qr-host{background:#fff;border-radius:16px;padding:14px;line-height:0}
  .join-info .k{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px}
  .join-info .url{font-size:1.05rem;font-weight:700;margin:.2rem 0 1rem;word-break:break-all}
  .pin-big{font-family:'Nunito';font-weight:900;font-size:clamp(2.5rem,8vw,4.5rem);letter-spacing:.5rem;color:var(--yellow);line-height:1}
  .pin-lbl{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px}
  .players-wrap{max-width:1100px;margin:1.5rem auto 0;text-align:center}
  .players-count{font-family:'Nunito';font-weight:900;font-size:1.4rem;margin-bottom:1rem}
  .chips{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center}
  .chip{background:var(--card);padding:.5rem 1rem;border-radius:20px;font-weight:700;font-size:.9rem;animation:pop .3s}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .lobby-actions{text-align:center;margin-top:2rem}

  #screen-q{padding:1.5rem;background:var(--bg)}
  .q-top{display:flex;align-items:center;justify-content:space-between;max-width:1100px;margin:0 auto 1rem;width:100%}
  .q-idx{font-family:'Nunito';font-weight:800;color:var(--muted)}
  .q-timer-circle{width:80px;height:80px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-family:'Nunito';font-weight:900;font-size:2rem;border:5px solid var(--green);transition:border-color .3s}
  .q-timer-circle.urgent{border-color:var(--red)}
  .q-answered{font-family:'Nunito';font-weight:800;color:var(--yellow)}
  .q-text-big{font-family:'Nunito';font-weight:900;font-size:clamp(1.4rem,4vw,2.4rem);line-height:1.35;text-align:center;background:var(--surface);border-radius:18px;padding:2rem;max-width:1000px;margin:0 auto 1.5rem;width:100%}
  .q-tiles{max-width:1000px;margin:0 auto;width:100%}

  #screen-reveal{padding:1.5rem;background:radial-gradient(ellipse at top,#243b6b,#0e1428 65%)}
  .rv-head{text-align:center;max-width:1000px;margin:0 auto 1rem}
  .rv-rate{font-family:'Nunito';font-weight:900;font-size:clamp(2rem,6vw,3.2rem)}
  .rv-sub{color:var(--muted)}
  .rv-grid{display:grid;grid-template-columns:1.2fr .9fr;gap:1.5rem;max-width:1100px;margin:1rem auto;align-items:start}
  @media(max-width:820px){.rv-grid{grid-template-columns:1fr}}
  .bars{background:var(--surface);border-radius:16px;padding:1.25rem}
  .bars-title{font-size:.78rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:1rem}
  .bar-row{display:flex;flex-direction:column;gap:.55rem;padding:.85rem 1rem;border-radius:12px;margin-bottom:.7rem;background:rgba(255,255,255,.04)}
  .bar-row:last-child{margin-bottom:0}
  .bar-row.correct{background:rgba(46,204,113,.13);outline:2px solid var(--green)}
  .bar-head{display:flex;align-items:flex-start;gap:.7rem}
  .bar-sh{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0;color:#fff;font-size:.95rem}
  .bar-sh.A{background:var(--a)}.bar-sh.B{background:var(--b)}.bar-sh.C{background:var(--c)}.bar-sh.D{background:var(--d);color:#1a1a2e}
  .bar-label{flex:1;font-weight:700;font-size:1rem;line-height:1.35;word-break:break-word}
  .bar-label .ok{color:var(--green);font-weight:900;margin-left:.25rem}
  .bar-cnt{flex-shrink:0;font-family:'Nunito';font-weight:900;font-size:1.05rem;min-width:2.2rem;text-align:right}
  .bar-track{height:12px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden}
  .bar-fill{height:100%;border-radius:6px;transition:width .6s;min-width:2px}
  .bar-fill.A{background:var(--a)}.bar-fill.B{background:var(--b)}.bar-fill.C{background:var(--c)}.bar-fill.D{background:var(--d)}
  .scorecard{background:var(--surface);border-radius:16px;padding:1.25rem}
  .scorecard h3{font-size:.78rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:.85rem}
  .lrow{display:flex;align-items:center;gap:.75rem;padding:.6rem .4rem;border-bottom:1px solid rgba(255,255,255,.06)}
  .lrow:last-child{border-bottom:none}
  .rk{font-family:'Nunito';font-weight:900;width:26px;text-align:center;color:var(--muted);flex-shrink:0}
  .rn{flex:1;font-weight:700;line-height:1.3;word-break:break-word}
  .rs{font-family:'Nunito';font-weight:800;color:var(--yellow);flex-shrink:0}
  .rv-actions{text-align:center;margin-top:1.5rem}

  #screen-final{padding:1.5rem;background:radial-gradient(ellipse at top,#243b6b,#0e1428 60%)}
  .f-title{text-align:center;font-size:2rem;font-weight:900;margin:.5rem 0 1.5rem}
  .podium{display:flex;justify-content:center;align-items:flex-end;gap:1rem;min-height:360px;max-width:760px;margin:0 auto 1.5rem}
  .plat{flex:1;max-width:220px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
  .p-av{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Nunito';font-weight:900;font-size:2rem;color:#1a1a2e;margin-bottom:.5rem;border:4px solid rgba(255,255,255,.3)}
  .p-nm{font-family:'Nunito';font-weight:800;font-size:1.15rem;text-align:center;max-width:210px;line-height:1.25;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .p-sc{color:var(--yellow);font-weight:800;margin-bottom:.55rem}
  .p-bl{width:100%;border-radius:14px 14px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:1rem;font-family:'Nunito';font-weight:900;font-size:2.8rem;color:rgba(255,255,255,.9)}
  .first .p-av{background:var(--gold)}.first .p-bl{background:linear-gradient(180deg,var(--gold),#b8860b);height:280px}
  .second .p-av{background:var(--silver)}.second .p-bl{background:linear-gradient(180deg,var(--silver),#808080);height:200px}
  .third .p-av{background:var(--bronze)}.third .p-bl{background:linear-gradient(180deg,var(--bronze),#8b5a2b);height:140px}
  .crown{font-size:2rem;margin-bottom:.25rem}
  .f-board{max-width:600px;margin:0 auto}
</style>
</head>
<body>

<div id="screen-setup" class="screen active">
  <div class="badge">SAFe® Scrum Master · Live Game</div>
  <h1 class="big">🎬 Host a Live Game</h1>
  <p class="sub">Pick a lesson. Everyone gets the same questions, in sync.</p>
  <div id="fb-warn"></div>
  <div class="pick" id="pick"></div>
  <button class="btn btn-primary" id="create-btn" style="font-size:1.1rem;padding:1rem 3rem" onclick="createGame()" disabled>Create game →</button>
  <div style="margin-top:1rem"><a class="btn btn-secondary" href="index.html" style="font-size:.85rem;padding:.5rem 1.2rem">← Hub</a></div>
</div>

<div id="screen-lobby" class="screen">
  <div class="lobby-top">
    <div><h1 class="big" id="lobby-lesson">Lesson</h1><span class="sub" id="lobby-sub"></span></div>
    <button class="btn btn-secondary" onclick="cancelGame()" style="font-size:.85rem;padding:.5rem 1.2rem">✕ End game</button>
  </div>
  <div class="join-box">
    <div class="qr-host" id="qr-host"></div>
    <div class="join-info">
      <div class="k">Join at</div>
      <div class="url" id="join-url">play.html</div>
      <div class="pin-lbl">Game PIN</div>
      <div class="pin-big" id="pin-big">------</div>
    </div>
  </div>
  <div class="players-wrap">
    <div class="players-count" id="players-count">Waiting for players…</div>
    <div class="chips" id="chips"></div>
    <div class="lobby-actions">
      <button class="btn btn-green" id="start-btn" style="font-size:1.15rem;padding:1rem 3.5rem" onclick="startGame()">Start game 🚀</button>
    </div>
  </div>
</div>

<div id="screen-q" class="screen">
  <div class="q-top">
    <div class="q-idx" id="q-idx">Question 1 / 10</div>
    <div class="q-timer-circle" id="q-timer">20</div>
    <div class="q-answered" id="q-answered">0 answered</div>
  </div>
  <div class="q-text-big" id="q-text"></div>
  <div class="q-tiles tiles" id="q-tiles"></div>
</div>

<div id="screen-reveal" class="screen">
  <div class="rv-head">
    <div class="rv-rate" id="rv-rate">–</div>
    <div class="rv-sub" id="rv-sub">answered correctly</div>
  </div>
  <div class="rv-grid">
    <div class="bars" id="rv-bars"></div>
    <div class="scorecard"><h3>🏆 Leaderboard</h3><div id="rv-board"></div></div>
  </div>
  <div class="rv-actions">
    <button class="btn btn-yellow" id="next-btn" style="font-size:1.1rem;padding:.9rem 3rem" onclick="nextQuestion()">Next →</button>
  </div>
</div>

<div id="screen-final" class="screen">
  <div class="f-title">🏆 Final Results</div>
  <div class="podium" id="f-podium"></div>
  <div class="f-board" id="f-board"></div>
  <div style="text-align:center;margin-top:1.5rem">
    <button class="btn btn-primary" onclick="location.reload()">🔄 New game</button>
    <a class="btn btn-secondary" href="index.html">🏠 Hub</a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════ FIREBASE CONFIG (required for live multiplayer) ═══════════
   One-time setup (free, ~5 min):
   1. Go to https://console.firebase.google.com  →  Add project
   2. Build → Realtime Database → Create database → Start in TEST MODE
   3. Project settings (gear) → Your apps → Web app (</>) → register
   4. Copy the firebaseConfig object it gives you over the one below
      (make sure databaseURL is included).
   The SAME config goes in BOTH host-game.html and play.html. */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBUjsot15FuYuB2or9XklqF3H_-Bnxi9YE",
  authDomain: "safe-quiz-20238.firebaseapp.com",
  databaseURL: "https://safe-quiz-20238-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "safe-quiz-20238",
  storageBucket: "safe-quiz-20238.firebasestorage.app",
  messagingSenderId: "728130638190",
  appId: "1:728130638190:web:6f9ae15944ad6c2b6d317f",
  measurementId: "G-F63L91MNJV"
};

const LESSONS = [{"id": 1, "title": "Introducing Scrum in SAFe", "icon": "🚀", "color": "#e21b3c", "draw": 10, "questions": [{"q": "Which best describes the primary purpose of the Agile Manifesto?", "answers": ["To replace all project management frameworks", "To define values and principles for better software development", "To standardize Scrum ceremonies across organizations", "To eliminate documentation from software projects"], "correct": 1, "explanation": "The Agile Manifesto defines shared values and principles — it doesn't replace frameworks or eliminate docs entirely.", "qid": "L1Q0"}, {"q": "According to SAFe, how large is a typical Agile Team?", "answers": ["5 to 7 members", "10 or fewer members", "15 to 20 members", "Any size that fits the project"], "correct": 1, "explanation": "SAFe Agile Teams are optimized for communication and typically include 10 team members or fewer.", "qid": "L1Q1"}, {"q": "Which two specialty roles exist within a SAFe Agile Team?", "answers": ["RTE and System Architect", "Scrum Master and Release Manager", "Scrum Master and Product Owner", "Product Manager and Business Owner"], "correct": 2, "explanation": "SAFe Agile Teams have two specialty roles: Scrum Master and Product Owner.", "qid": "L1Q2"}, {"q": "How many Agile Teams typically make up an Agile Release Train (ART)?", "answers": ["1–3 teams", "5–12 teams", "15–20 teams", "20–30 teams"], "correct": 1, "explanation": "An ART is a virtual organization of 5–12 teams (50–125+ individuals) on a common cadence.", "qid": "L1Q3"}, {"q": "In the Agile Manifesto, which is valued MORE?", "answers": ["Comprehensive documentation", "Both are equally valued", "Working software", "Neither — the manifesto focuses on people"], "correct": 2, "explanation": "The Manifesto values 'Working software over comprehensive documentation,' while noting documentation still has value.", "qid": "L1Q4"}, {"q": "Why is limiting Work In Progress (WIP) important?", "answers": ["It improves multitasking efficiency", "Excessive WIP reduces throughput and focus", "It helps forecast budgets", "It increases total team capacity"], "correct": 1, "explanation": "Limiting WIP reduces context switching and improves flow — shown by the number/letter 'too much WIP' activity.", "qid": "L1Q5"}, {"q": "Which SAFe event serves as the 'heartbeat' of the Agile Release Train?", "answers": ["System Demo", "Inspect & Adapt", "PI Planning", "Coach Sync"], "correct": 2, "explanation": "PI Planning is the cadence-based heartbeat of the ART, aligning all teams to a shared mission and vision.", "qid": "L1Q6"}, {"q": "What is the timebox for a PI Planning event?", "answers": ["Half a day", "One day", "Two days every 8–12 weeks", "One week every quarter"], "correct": 2, "explanation": "PI Planning is a two-day event, typically every 8–12 weeks (10 weeks is the most common cadence).", "qid": "L1Q7"}, {"q": "What is a primary responsibility of a Product Owner?", "answers": ["Facilitating PI Planning and team events", "Managing and prioritizing the team backlog", "Coordinating ART performance with the RTE", "Organizing IP-iteration hackathons"], "correct": 1, "explanation": "The PO connects with customers, manages/prioritizes the team backlog, and supports value delivery.", "qid": "L1Q8"}, {"q": "What are NFRs and how do they relate to the ART backlog?", "answers": ["Non-Functional Requirements — inputs to PI Planning alongside vision", "New Feature Requests — they replace user stories", "No-Fix Risks — tracked in the ROAM register", "Net Flow Ratios — they measure predictability"], "correct": 0, "explanation": "NFRs (Non-Functional Requirements) are inputs into PI Planning — constraints like performance, security, and scalability.", "qid": "L1Q9"}, {"q": "What is the key benefit of incremental delivery over waterfall?", "answers": ["It removes the need for testing", "Earlier value delivery and fast feedback", "It guarantees fixed scope", "It eliminates the need for planning"], "correct": 1, "explanation": "Agile economics: delivering early and often produces fast feedback and delivers value incrementally rather than all at the end.", "qid": "L1Q10"}, {"q": "Which two approaches do SAFe teams use for Team Agility?", "answers": ["Waterfall and Kanban", "Scrum and Kanban", "Lean and Six Sigma", "XP and PRINCE2"], "correct": 1, "explanation": "Teams use SAFe Scrum and SAFe Team Kanban for Team Agility, plus built-in quality practices for Technical Agility.", "qid": "L1Q11"}, {"q": "What is the timebox and value of a System Demo?", "answers": ["2 days — teams commit to PI objectives", "1 hour — deliverables reviewed with stakeholders for feedback", "Half a day — the ART improves its process", "30 min — teams sync on daily progress"], "correct": 1, "explanation": "The System Demo is ~1 hour; stakeholders review integrated deliverables and provide feedback.", "qid": "L1Q12"}, {"q": "What is the timebox for the Inspect & Adapt event?", "answers": ["1 hour", "Half a day", "2 days", "15 minutes"], "correct": 1, "explanation": "Inspect & Adapt is a half-day event where the ART reviews and improves its process before the next PI.", "qid": "L1Q13"}, {"q": "What does an Agile Team deliver each iteration?", "answers": ["A design document for review", "Working, tested, full-system increments", "A status report to management", "A prioritized backlog"], "correct": 1, "explanation": "Agile Teams deliver working, tested, full-system increments (typically every two weeks) on a common cadence.", "qid": "L1Q14"}, {"q": "Which is a built-in quality practice in SAFe?", "answers": ["Manual regression only at release", "Pairing, peer review, and definition of done", "Separate QA phase after development", "Documenting every design decision"], "correct": 1, "explanation": "Built-in quality practices include shift learning left, pairing/peer review, collective ownership, and a definition of done (DoD).", "qid": "L1Q15"}, {"q": "Which is NOT one of the core responsibilities of an Agile Team?", "answers": ["Connecting with the customer", "Delivering value", "Approving the portfolio budget", "Improving relentlessly"], "correct": 2, "explanation": "Agile Team responsibilities include connecting with the customer, planning work, delivering value, getting feedback, and improving relentlessly — not portfolio budgeting.", "qid": "L1Q16"}, {"q": "An Agile Release Train is aligned to a common mission via what?", "answers": ["A single ART backlog", "Individual team backlogs only", "The portfolio Kanban", "A project charter"], "correct": 0, "explanation": "An ART is synchronized on a common cadence (the PI) and aligned to a common mission via a single ART backlog.", "qid": "L1Q17"}]}, {"id": 2, "title": "Characterizing the Role of the Scrum Master", "icon": "🎯", "color": "#1368ce", "draw": 10, "questions": [{"q": "Which best describes the Scrum Master's leadership style in SAFe?", "answers": ["Command and control", "Servant leadership", "Transactional leadership", "Directive leadership"], "correct": 1, "explanation": "The SAFe Scrum Master is a servant leader — facilitating the growth of others rather than directing them.", "qid": "L2Q0"}, {"q": "What are the five key responsibilities of a Scrum Master in SAFe?", "answers": ["Sprint planning, standups, demos, retros, grooming", "Facilitating PI Planning, supporting iteration execution, building high-performing teams, improving flow, improving ART performance", "Coaching, mentoring, planning, executing, reporting", "Vision, mission, strategy, tactics, delivery"], "correct": 1, "explanation": "The five SM responsibilities: Facilitate PI Planning, Support Iteration Execution, Build High-Performing Teams, Improve Flow, Improve ART performance.", "qid": "L2Q1"}, {"q": "In Tuckman's model, what is the correct order of team development stages?", "answers": ["Planning, Doing, Checking, Acting", "Forming, Storming, Norming, Performing", "Alignment, Collaboration, Delivery, Improvement", "Discovery, Development, Testing, Release"], "correct": 1, "explanation": "Tuckman's stages: Forming, Storming, Norming, Performing.", "qid": "L2Q2"}, {"q": "According to Lencioni, which is the FOUNDATION of all other team dysfunctions?", "answers": ["Inattention to Results", "Avoidance of Accountability", "Absence of Trust", "Fear of Conflict"], "correct": 2, "explanation": "Absence of Trust is the foundational dysfunction that leads to the other four.", "qid": "L2Q3"}, {"q": "What is the purpose of a Coach Sync in SAFe?", "answers": ["POs sync on backlog priorities", "Scrum Masters sync with the RTE on PI progress — weekly, 30–60 min", "The team syncs daily on tasks", "Business Owners review demo results"], "correct": 1, "explanation": "The Coach Sync is facilitated by the RTE, includes Scrum Masters, and is timeboxed to 30–60 minutes weekly.", "qid": "L2Q4"}, {"q": "What should a Scrum Master do when the team faces conflict?", "answers": ["Make the decision to move things forward quickly", "Escalate immediately to management", "Help members identify common goals and challenge assumptions", "Assign blame and document formally"], "correct": 2, "explanation": "SMs resolve conflict by identifying what each party wants and why, finding the common goal, and challenging assumptions together.", "qid": "L2Q5"}, {"q": "What is the Scrum Master's relationship with the RTE?", "answers": ["A direct subordinate of the RTE", "Works with the RTE to ensure the train meets its PI objectives", "Replaces the RTE when absent", "Evaluates the RTE's performance"], "correct": 1, "explanation": "The SM works with the RTE to ensure the train meets PI objectives and joins sync events with ART leadership.", "qid": "L2Q6"}, {"q": "Which is a common attribute of a HIGH-PERFORMING team?", "answers": ["Constant change in team composition", "Siloed work with minimal communication", "Mutual trust, healthy conflict, and clear goals", "Individual heroics over collaboration"], "correct": 2, "explanation": "High-performing teams show mutual trust, healthy conflict, clear goals, open communication, and self-organization.", "qid": "L2Q7"}, {"q": "How does SAFe help address the 'Fear of Conflict' dysfunction?", "answers": ["A mediator is assigned to every disagreement", "Scrum creates a safe environment for conflict; shared commitment reduces misaligned conflict", "Disagreements are eliminated through rigid planning", "Team leads rotate each iteration"], "correct": 1, "explanation": "SAFe's Scrum environment encourages safe disagreement, and shared PI objectives reduce individual conflict from misaligned goals.", "qid": "L2Q8"}, {"q": "What does 'persuade rather than use authority' mean for a Scrum Master?", "answers": ["The SM never makes any decision", "The SM uses facts and questions to help the team rethink, rather than directing outcomes", "The SM defers all decisions to the PO", "The SM stays neutral to avoid conflict"], "correct": 1, "explanation": "Servant leadership means influencing through questions, facts, and new perspectives — not authority.", "qid": "L2Q9"}, {"q": "What is the purpose of team working agreements?", "answers": ["To assign individual performance targets", "To facilitate conflict management and set shared expectations", "To document architectural decisions", "To replace the definition of done"], "correct": 1, "explanation": "Working agreements (e.g., respect others' opinions, support consensus, avoid blocking the team) help manage conflict and align behavior.", "qid": "L2Q10"}, {"q": "How does SAFe help address 'Inattention to Results'?", "answers": ["Results are empirically reviewed each iteration and release; retrospectives drive improvement", "Results are only reviewed annually", "Only managers review results", "Results are not measured in Agile"], "correct": 0, "explanation": "Empirical review at the end of every iteration and release, plus Iteration Retrospectives, keeps focus on results.", "qid": "L2Q11"}, {"q": "According to research on teams, why is face-to-face communication valued?", "answers": ["It is the only allowed form of communication", "It is extremely efficient for high-performing teams", "It replaces the need for tools", "It is required by the Agile Manifesto"], "correct": 1, "explanation": "High-performing teams benefit from efficient face-to-face communication and planned periods of focused, uninterrupted work.", "qid": "L2Q12"}, {"q": "When reaching a consensus, what does SAFe suggest doing first if there's disagreement?", "answers": ["Immediately take a majority vote", "Let people exchange thoughts, starting with someone who disagrees", "Escalate to the RTE", "Remove the disagreeing person from the discussion"], "correct": 1, "explanation": "Begin with someone who disagrees, then someone who agrees; decompose the disagreement and seek modifications before falling back to a majority decision.", "qid": "L2Q13"}, {"q": "What is a 'meet-after'?", "answers": ["A retrospective held after the PI", "An optional follow-up session for deeper discussion after a timeboxed event", "A stakeholder review after the System Demo", "A mandatory manager debrief"], "correct": 1, "explanation": "Timeboxed events (like the Coach Sync) are followed by an optional meet-after for those who need to dive deeper.", "qid": "L2Q14"}, {"q": "Which servant-leader trait involves setting long-term operating goals for the team?", "answers": ["Persuades rather than uses authority", "Thinks beyond day-to-day activities", "Is open and appreciates openness", "Understands and empathizes with others"], "correct": 1, "explanation": "'Thinks beyond day-to-day activities' includes setting long-term goals like Agile practices to master or new skills to acquire.", "qid": "L2Q15"}]}, {"id": 3, "title": "Experiencing PI Planning", "icon": "📅", "color": "#26890c", "draw": 10, "questions": [{"q": "What is the primary OUTPUT of PI Planning?", "answers": ["A one-year product roadmap", "Team and ART PI objectives and an ART planning board", "A release schedule for all portfolio ARTs", "An updated SAFe configuration"], "correct": 1, "explanation": "Outputs include Team PI objectives, ART PI objectives, and the ART planning board with iteration plans.", "qid": "L3Q0"}, {"q": "What is a Feature in SAFe?", "answers": ["A small increment fitting one iteration for one team", "A service with a benefit hypothesis that fits in one PI for one ART", "A task to build the architectural runway", "An epic split across multiple ARTs"], "correct": 1, "explanation": "Features represent ART work, include a benefit hypothesis and acceptance criteria, and fit in one PI.", "qid": "L3Q1"}, {"q": "What does ROAM stand for in PI Planning risk management?", "answers": ["Review, Own, Allocate, Mitigate", "Resolved, Owned, Accepted, Mitigated", "Risk, Opportunity, Action, Milestone", "Reduce, Overcome, Assess, Monitor"], "correct": 1, "explanation": "ROAM = Resolved, Owned, Accepted, Mitigated — the four ways teams categorize ART PI risks.", "qid": "L3Q2"}, {"q": "What is the purpose of the confidence vote at the end of PI Planning?", "answers": ["To rank teams by capability", "To confirm teams will meet objectives or escalate immediately if not feasible", "To vote on features for the next PI", "To evaluate the PI Planning event itself"], "correct": 1, "explanation": "A two-part commitment: teams agree to meet objectives AND to escalate immediately if objectives become unachievable.", "qid": "L3Q3"}, {"q": "What is a 'spike' in SAFe?", "answers": ["A sudden increase in story points", "A research activity to reduce risk or define a technical approach", "A mandatory architecture review event", "A tool used during objective setting"], "correct": 1, "explanation": "Spikes are research activities — technical spikes explore approaches/unknowns; functional spikes explore user interaction.", "qid": "L3Q4"}, {"q": "Who owns feature priorities during PI Planning?", "answers": ["The RTE", "Product Management", "The Scrum Master", "Business Owners"], "correct": 1, "explanation": "Product Management owns feature priorities; development teams own story planning and high-level estimates.", "qid": "L3Q5"}, {"q": "What is the user-story format used in SAFe?", "answers": ["Title, Description, Acceptance Criteria", "As a [role], I can [activity], so that [business value]", "Given, When, Then", "Feature, Enabler, Spike, Refactor"], "correct": 1, "explanation": "The user-voice format captures the end user's role, activity, and goal.", "qid": "L3Q6"}, {"q": "Which is a common Scrum Master ANTI-PATTERN during PI Planning?", "answers": ["Facilitating coordination with other teams", "Managing the ART planning board", "Pressuring the team to overcommit", "Running the PI Planning retrospective"], "correct": 2, "explanation": "Anti-patterns include pressure to overcommit, undercommitting from fear, and overplanning to make PI Planning 'efficient.'", "qid": "L3Q7"}, {"q": "What are Enabler Stories?", "answers": ["Stories that explain a feature's business value", "Groundwork stories: infrastructure, architecture, exploration, and compliance", "Stories added after a failed sprint", "Stories for the system team's integration work only"], "correct": 1, "explanation": "Enabler stories support future functionality; the four types are Infrastructure, Architecture, Exploration, and Compliance.", "qid": "L3Q8"}, {"q": "What should happen at the end of PI Planning?", "answers": ["Begin the first iteration with no review", "Run a PI Planning retrospective to improve the event", "Finalize the annual release plan", "Send objectives to portfolio for approval"], "correct": 1, "explanation": "End with a retrospective (what went well/didn't/can improve) to continuously improve future PI Plannings.", "qid": "L3Q9"}, {"q": "On the program board, what does a feature with NO strings (dependencies) mean?", "answers": ["It cannot be delivered this PI", "It has no dependencies on other teams", "It is a milestone", "It needs UX help"], "correct": 1, "explanation": "A feature with no strings has no dependencies; strings show significant dependencies between teams.", "qid": "L3Q10"}, {"q": "During the final plan review, what role do Business Owners play?", "answers": ["They write the team's PI objectives", "They are asked whether they accept the plan", "They assign story points", "They run the confidence vote"], "correct": 1, "explanation": "Business Owners peer-review final plans and are asked whether they accept them; if not, planning continues.", "qid": "L3Q11"}, {"q": "What confidence-vote score reflects 'high confidence' on the 1–5 fist-of-five scale?", "answers": ["1", "2", "4", "0"], "correct": 2, "explanation": "The scale runs from 1 (no confidence) to 5 (very high); 4 indicates high confidence.", "qid": "L3Q12"}, {"q": "When are a feature's acceptance criteria typically defined?", "answers": ["During ART backlog refinement", "Only after the feature is released", "During the confidence vote", "During the IP iteration"], "correct": 0, "explanation": "Acceptance criteria are typically defined during ART backlog refinement and reflect functional and non-functional requirements.", "qid": "L3Q13"}, {"q": "What is a refactor in SAFe?", "answers": ["Improving the system without changing observable behavior", "Adding a new user-facing feature", "Removing a story from the backlog", "Splitting a feature into an epic"], "correct": 0, "explanation": "Refactors systematically improve the system (maintainability, performance, scalability) without changing observable behavior.", "qid": "L3Q14"}, {"q": "What is a recommended practice for PI Planning with distributed teams?", "answers": ["Ask teams to commit while sleep-deprived", "Establish more planning overlap and inter-team checkpoints", "Avoid a centralized planning board", "Skip the confidence vote"], "correct": 1, "explanation": "For distributed teams: add planning overlap, more checkpoints/synchronization, respect time zones, and use a centralized ART planning board.", "qid": "L3Q15"}]}, {"id": 4, "title": "Facilitating Iteration Execution", "icon": "⚙️", "color": "#ffa602", "draw": 10, "questions": [{"q": "What is the timebox for Iteration Planning?", "answers": ["One hour or less", "Four hours or less per iteration", "Eight hours over two days", "One full day"], "correct": 1, "explanation": "Iteration Planning is timeboxed to four hours or less; it sequences/estimates stories and commits to goals.", "qid": "L4Q0"}, {"q": "What are iteration goals and why do they matter?", "answers": ["Metrics for individual performance", "Commitments providing clarity, transparency, and alignment to PI objectives", "Informal planning notes", "KPIs reported to executives"], "correct": 1, "explanation": "Iteration goals align members to a common purpose, align teams to PI objectives, manage dependencies, and inform management.", "qid": "L4Q1"}, {"q": "What does CALMR stand for in SAFe's DevOps approach?", "answers": ["Coordinate, Automate, Lead, Manage, Release", "Culture, Automation, Lean flow, Measurement, Recovery", "Collaborate, Align, Launch, Monitor, Refine", "Create, Analyze, Launch, Market, Retire"], "correct": 1, "explanation": "CALMR = Culture, Automation, Lean flow, Measurement, Recovery.", "qid": "L4Q2"}, {"q": "What is 'capacity allocation' in iteration planning?", "answers": ["Assigning members to tasks by skill", "Setting percentages of capacity for different work types (stories, refactors, maintenance)", "Calculating story points from velocity", "Distributing work equally to everyone"], "correct": 1, "explanation": "Capacity allocation balances new stories with maintenance/refactors, preventing velocity degradation from technical debt.", "qid": "L4Q3"}, {"q": "What is the Team Sync designed to accomplish?", "answers": ["Report status to management", "A timeboxed sync for the team to coordinate and surface blockers", "A detailed per-person task update", "Plan the next iteration"], "correct": 1, "explanation": "The Team Sync is a brief, timeboxed coordination event for team self-management — not management status reporting.", "qid": "L4Q4"}, {"q": "What does the Iteration Review demonstrate?", "answers": ["Velocity compared to other teams", "Working software and accomplishments to stakeholders for feedback", "Individual performance ratings", "The plan for the next iteration"], "correct": 1, "explanation": "The Iteration Review shows working, tested software to stakeholders who give feedback.", "qid": "L4Q5"}, {"q": "What is Backlog Refinement?", "answers": ["A ceremony to delete old items", "A continuous process of analyzing, estimating, and sequencing stories for upcoming iterations", "An event to re-prioritize features for the next PI", "Converting epics into features"], "correct": 1, "explanation": "Backlog Refinement is ongoing: stories are analyzed, acceptance criteria refined, estimated, and prepared for future iterations.", "qid": "L4Q6"}, {"q": "What is the purpose of 'tasking' in Iteration Planning?", "answers": ["Permanently assigning stories to developers", "Breaking stories into tasks to understand capacity, dependencies, and ownership", "Building a Gantt chart", "Deciding which stories move to next iteration"], "correct": 1, "explanation": "Tasking (optional) breaks stories into tasks, often estimated in hours, to understand capacity and dependencies.", "qid": "L4Q7"}, {"q": "What should a team do when iteration goals become unachievable?", "answers": ["Work overtime to meet the original commitment", "Silently drop the goal and report it complete", "Immediately raise the concern so corrective action can be taken", "Wait until iteration end to report it"], "correct": 2, "explanation": "Commitment means doing what you said OR immediately escalating; too rigid causes burnout, too little causes unpredictability.", "qid": "L4Q8"}, {"q": "Who facilitates Iteration Planning?", "answers": ["Only the RTE", "The Scrum Master or Product Owner", "A rotating team member", "Business Owners"], "correct": 1, "explanation": "Iteration Planning is facilitated by the Scrum Master or Product Owner, with the whole Agile Team actively engaged.", "qid": "L4Q9"}, {"q": "In the flow accelerator 'Reduce queue lengths,' why do long queues matter?", "answers": ["They shorten lead times", "Longer queues mean longer wait times, more risk, and lower quality", "They increase motivation", "They reduce variability"], "correct": 1, "explanation": "Long queues create longer lead times, increased risk, more variability, lower quality, and less motivation.", "qid": "L4Q10"}, {"q": "What is the point of working in smaller batches?", "answers": ["To maximize batch size for efficiency", "To balance transaction and holding costs and improve flow", "To reduce the number of iterations", "To avoid measuring flow"], "correct": 1, "explanation": "Small batches lower total cost by balancing transaction and holding costs, and enable faster feedback and flow.", "qid": "L4Q11"}, {"q": "In CALMR, what does 'Recovery' focus on?", "answers": ["Recovering lost story points", "Enabling low-risk releases with fast recovery, reversion, and fix-forward", "Recovering team morale after failures", "Recovering deleted code"], "correct": 1, "explanation": "Recovery: architect low-risk releases and establish fast recovery, fast reversion, and fast fix-forward to reduce risk.", "qid": "L4Q12"}, {"q": "What is the purpose of the DevOps 'maximize speed and stability' balance?", "answers": ["Choose speed over stability always", "Combine development speed and operational stability by sharing responsibility", "Separate Dev and Ops for clearer accountability", "Optimize only for stability"], "correct": 1, "explanation": "DevOps blends teams optimized for speed with those optimized for stability, working together via shared responsibility.", "qid": "L4Q13"}, {"q": "Story analysis and estimating continues until what point?", "answers": ["All backlog items are estimated", "The estimation of stories reaches the capacity of the team", "The Scrum Master ends the meeting", "Every story has tasks"], "correct": 1, "explanation": "The PO presents stories by priority; the team discusses, refines acceptance criteria, and estimates until reaching team capacity.", "qid": "L4Q14"}, {"q": "What does optimizing time 'in the zone' require?", "answers": ["More meetings for alignment", "Lower WIP, fewer interruptions, and productive collaboration patterns", "Longer working hours", "More status reporting"], "correct": 1, "explanation": "Keep WIP low to reduce context-switching, question meeting efficiency, and use collaboration like pairing/mobbing.", "qid": "L4Q15"}]}, {"id": 5, "title": "Finishing the PI", "icon": "🏁", "color": "#9b59b6", "draw": 10, "questions": [{"q": "What is the purpose of the Innovation and Planning (IP) Iteration?", "answers": ["A regular sprint with double capacity", "A cadence-based buffer for innovation, hackathons, infrastructure, and PI Planning prep", "A sprint only for bug fixes", "An optional iteration teams may skip"], "correct": 1, "explanation": "The IP Iteration provides a guard band for reliability, PI readiness, planning, and innovation — not just overflow.", "qid": "L5Q0"}, {"q": "What is a hackathon in the IP Iteration?", "answers": ["A competition against other ARTs", "A 1–2 day event where teams work on mission-aligned ideas, then demo results", "A next-PI planning event", "An external security audit"], "correct": 1, "explanation": "Hackathons: people work on what they want, with whom they want, as long as it reflects the mission — and demo at the end.", "qid": "L5Q1"}, {"q": "What does the ART Predictability Measure show?", "answers": ["Team velocity across the organization", "Actual business value achieved vs. planned business value across PIs", "The ROI of individual features", "Defects per iteration"], "correct": 1, "explanation": "It reports actual vs. planned business value as a percentage, targeting an effective process control range.", "qid": "L5Q2"}, {"q": "What are the six steps of the Inspect & Adapt problem-solving workshop?", "answers": ["Plan, Do, Check, Act, Reflect, Improve", "Agree on problem → Pareto → 5 Whys → Restate → Brainstorm → Identify improvement items", "Measure → Root cause → Assign → Fix → Verify → Close", "Retro → Backlog → Plan → Execute → Review → Deploy"], "correct": 1, "explanation": "Steps: Agree on the problem → Pareto analysis → 5 Whys/root cause → Restate problem → Brainstorm → Identify improvement backlog items.", "qid": "L5Q3"}, {"q": "What is a Scrum Master ANTI-PATTERN during the PI System Demo?", "answers": ["Helping the team prepare", "Allowing only the PO to present", "Facilitating the problem-solving workshop", "Providing team data"], "correct": 1, "explanation": "Having only the PO present is an anti-pattern — the SM should facilitate full team participation.", "qid": "L5Q4"}, {"q": "What is a 'supplier showcase' in the IP Iteration?", "answers": ["A trade show to sell products", "A structured demo from a supplier to help teams better leverage its products/services", "A vendor contract review", "A system-team integration report"], "correct": 1, "explanation": "Supplier showcases help teams reduce work by leveraging supplier products and help POs/PMs identify enablers and improve roadmaps.", "qid": "L5Q5"}, {"q": "How are PI Objectives rated in the team performance assessment?", "answers": ["Simple pass/fail on all stories", "Planned business value (1–10) vs. actual, averaged into an ART % achievement", "Story points delivered as a percentage", "Time spent vs. budgeted per feature"], "correct": 1, "explanation": "Each objective gets a planned business value (1–10); actuals are rated and averaged into an ART % achievement score.", "qid": "L5Q6"}, {"q": "What is a Scrum Master best practice during Inspect & Adapt?", "answers": ["Facilitate PI System Demo prep and provide team data", "Take notes and report to management afterward", "Delegate all I&A to the PO", "Skip the workshop if velocity was on target"], "correct": 0, "explanation": "Best practices: facilitate PI System Demo prep, provide team data, facilitate the workshop, and ensure improvement items enter PI Planning.", "qid": "L5Q7"}, {"q": "Where do improvement items from the I&A workshop go?", "answers": ["A separate log outside planning", "Into the PI Planning process as backlog items for the next PI", "To the portfolio team for budget approval", "Into a wiki for reference only"], "correct": 1, "explanation": "Improvement items should enter the next PI's planning as real backlog items — not disappear into a side log.", "qid": "L5Q8"}, {"q": "Why explore spikes during the IP Iteration?", "answers": ["To finish committed stories that fell behind", "To research uncertain areas and reduce risk before the next PI", "To give more capacity to fast developers", "To boost team morale"], "correct": 1, "explanation": "Exploring spikes in the IP Iteration reduces technical risk and uncertainty ahead of the next PI.", "qid": "L5Q9"}, {"q": "What does the IP Iteration provide for cadence-based delivery?", "answers": ["A guarantee that all work finishes", "An estimating guard band / capacity margin to enable cadence", "A way to skip PI Planning", "Extra budget for the ART"], "correct": 1, "explanation": "The IP iteration provides an estimating guard band and capacity margin so the ART can reliably operate on cadence.", "qid": "L5Q10"}, {"q": "From where can innovative ideas come, per SAFe?", "answers": ["Only from Agile Teams", "Both internal sources (teams) and external sources (customers, suppliers, competitors)", "Only from leadership", "Only from customers"], "correct": 1, "explanation": "Innovation comes from many internal and external sources — teams, customer requests, suppliers, and competitors.", "qid": "L5Q11"}, {"q": "If ad hoc teams are used for the Inspect & Adapt, what may the Scrum Master's role become?", "answers": ["They must always facilitate", "They may be participants rather than facilitators", "They must present the whole demo", "They should skip the event"], "correct": 1, "explanation": "When ad hoc teams are formed for I&A, Scrum Masters may participate rather than facilitate.", "qid": "L5Q12"}, {"q": "What analysis technique identifies the biggest root cause in the problem-solving workshop?", "answers": ["SWOT analysis", "Pareto analysis", "Monte Carlo simulation", "Value stream mapping"], "correct": 1, "explanation": "Pareto analysis identifies the biggest root cause; the '5 Whys' then drills into it.", "qid": "L5Q13"}, {"q": "What is the suggested timebox for the team performance assessment?", "answers": ["10–15 minutes", "45–60 minutes", "2 hours", "A full day"], "correct": 1, "explanation": "The team performance assessment is suggested to run about 45–60 minutes.", "qid": "L5Q14"}]}, {"id": 6, "title": "AI for Scrum Masters", "icon": "🤖", "color": "#1abc9c", "draw": 10, "questions": [{"q": "What is Generative AI (GenAI)?", "answers": ["AI that writes code with no human input", "Deep learning that creates new realistic outputs trained on vast datasets", "AI only for project management automation", "ML limited to analyzing past trends"], "correct": 1, "explanation": "GenAI is deep learning that creates new realistic outputs; it sits inside the AI > ML > DL > GenAI hierarchy.", "qid": "L6Q0"}, {"q": "What is a 'prompt' for a Large Language Model?", "answers": ["A scheduled meeting reminder", "The set of instructions you feed an AI to steer its response", "The AI's generated output", "A system configuration setting"], "correct": 1, "explanation": "A prompt is your instruction to the AI; effective prompts specify objective, scope, and tone.", "qid": "L6Q1"}, {"q": "What does RAG stand for and what is its benefit?", "answers": ["Random Access Generation — faster retrieval", "Retrieval Augmented Generation — lets an LLM use a trusted knowledge base for accuracy", "Recursive Algorithm Generation — self-improvement", "Rapid AI Guidance — real-time coaching"], "correct": 1, "explanation": "RAG gives an LLM a 'reference library' of trusted knowledge to produce more accurate, relevant answers.", "qid": "L6Q2"}, {"q": "Which attributes belong to 'Trustworthy AI'?", "answers": ["Inclusiveness and Sustainability", "Transparency and Interpretability", "Privacy, Security, Reliability, and Accuracy", "Fairness and Ethics"], "correct": 2, "explanation": "Trustworthy AI: Privacy, Security, Resilience, Reliability, Accuracy. (Transparency=Explainable; Fairness/Ethics=Human-centric.)", "qid": "L6Q3"}, {"q": "What is the AI 'Hallucination' risk?", "answers": ["AI becoming too complex to understand", "AI producing plausible-sounding but wrong or nonsensical outputs", "Using AI without authorization", "AI replacing human judgment"], "correct": 1, "explanation": "Hallucination is when AI generates confident but incorrect outputs — a key risk for SM tasks.", "qid": "L6Q4"}, {"q": "What is the 'Garbage In, Garbage Out' principle?", "answers": ["Old models should be replaced often", "Flawed or biased data produces flawed or biased AI outputs", "AI should only do low-value tasks", "Prompt quality doesn't matter"], "correct": 1, "explanation": "Good data = smart, fair AI; bad data = biased, misleading AI — even when the output looks polished.", "qid": "L6Q5"}, {"q": "How can a Scrum Master use AI for FACILITATION?", "answers": ["Run retros automatically with no human involvement", "Draft retro questions, icebreakers, or planning agendas — then edit for team context", "Make all team decisions", "Replace the need for retrospectives"], "correct": 1, "explanation": "AI can draft facilitation materials, but outputs must be reviewed, edited for context, and checked for bias.", "qid": "L6Q6"}, {"q": "What are the five steps to develop an AI-Augmented Workforce?", "answers": ["Pilot, Scale, Optimize, Monitor, Retire", "Identify tools/use cases, Ensure responsible AI, Measure impact, Invest in upskilling, Foster innovation", "Train, Deploy, Evaluate, Improve, Repeat", "Assess, Plan, Build, Test, Release"], "correct": 1, "explanation": "The five steps: Identify AI tools/use cases → Ensure responsible AI → Measure/monitor impact → Invest in upskilling → Foster innovation culture.", "qid": "L6Q7"}, {"q": "What should a Scrum Master ALWAYS do with AI-generated content before team use?", "answers": ["Share it directly to save time", "Submit to the RTE for approval", "Review, edit for accuracy and context, and check for bias", "Archive it unchanged"], "correct": 2, "explanation": "AI outputs can carry bias and lack context — always review, edit, verify, and adapt before use.", "qid": "L6Q8"}, {"q": "What does the SAFe prompting template (Goal, Role, Task, Context, Details) do?", "answers": ["Automate ceremonies with no human input", "Help users craft clear, effective prompts with enough context", "Replace the PO in prioritization", "Auto-generate PI objectives"], "correct": 1, "explanation": "The GRTCD structure ensures clarity: Goal, Role, Task, Context, Details — for better AI responses.", "qid": "L6Q9"}, {"q": "How do humans and machines differ in intelligence, per the course?", "answers": ["Machines are emotionally aware; humans find patterns", "Humans handle context/nuance and moral reasoning; machines find patterns at scale but lack judgment", "Both are identical in capability", "Machines have consciousness and intent"], "correct": 1, "explanation": "Humans are flexible, emotionally aware, and capable of moral reasoning; machines excel at patterns at scale but lack consciousness or ethical judgment.", "qid": "L6Q10"}, {"q": "Which is an example of a real-world AI risk/disaster cited in the course?", "answers": ["An attorney filed a brief with hallucinated case citations from ChatGPT", "AI achieving human-level consciousness", "A model refusing to answer any questions", "AI eliminating all software bugs"], "correct": 0, "explanation": "Examples include hallucinated legal citations, biased healthcare triage, and confidential data leaked into ChatGPT.", "qid": "L6Q11"}, {"q": "What is an AI agent?", "answers": ["A person who manages AI tools", "An AI system that reasons, plans, and executes multi-step tasks using tools and APIs", "A prompt template", "A type of training dataset"], "correct": 1, "explanation": "AI agents reason, plan, and execute multi-step tasks by interacting with tools and systems — best for complex automation, with reliability as a key risk.", "qid": "L6Q12"}, {"q": "Which are the three categories of Responsible AI in the course?", "answers": ["Fast AI, Cheap AI, Smart AI", "Trustworthy AI, Explainable AI, Human-centric AI", "Narrow AI, General AI, Super AI", "Cloud AI, Edge AI, Hybrid AI"], "correct": 1, "explanation": "Responsible AI is framed as Trustworthy AI, Explainable AI, and Human-centric AI.", "qid": "L6Q13"}, {"q": "What defines an AI-augmented workforce?", "answers": ["AI fully replaces human workers", "AI works alongside humans to reduce repetitive tasks and free people for creativity and judgment", "Humans only supervise AI output", "AI operates with no human oversight"], "correct": 1, "explanation": "AI works alongside humans — reducing repetitive tasks and letting people focus on creativity, judgment, and teamwork.", "qid": "L6Q14"}, {"q": "Which attributes belong to 'Human-centric AI'?", "answers": ["Privacy and Reliability", "Transparency and Accountability", "Safety, Fairness, Ethics, Inclusiveness, Sustainability, Compliance", "Speed and Scale"], "correct": 2, "explanation": "Human-centric AI: Safety, Fairness, Ethics, Inclusiveness, Sustainability, and Compliance.", "qid": "L6Q15"}]}];
const DUR = 20;
let db=null, fbReady=false;
function configLooksSet(){const c=FIREBASE_CONFIG||{};return !!(c.apiKey&&c.databaseURL&&c.apiKey.indexOf('PASTE')<0&&c.databaseURL.indexOf('PASTE')<0);}
function ensureFirebase(){
  if(fbReady)return '';
  if(typeof firebase==='undefined')return "Firebase didn't load — check your internet connection (the app loads Firebase from the web), then reload the page.";
  if(!configLooksSet())return "Firebase isn't set up yet.\n\nOpen host-game.html and play.html, paste your firebaseConfig into the block at the top of the script, save, then reload this page.";
  try{ if(!firebase.apps||!firebase.apps.length){firebase.initializeApp(FIREBASE_CONFIG);} db=firebase.database(); fbReady=true; return ''; }
  catch(e){ return "Firebase init error: "+((e&&e.message)||e); }
}

let selLesson=null, pin=null, gameRef=null, game=null, hostTimer=null, revealed=false;

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* setup screen */
function initSetup(){
  if(typeof firebase==='undefined' || !configLooksSet()){
    document.getElementById('fb-warn').innerHTML='<div class="setup-warn">⚙️ <b>Live multiplayer needs a free Firebase project.</b> Paste your <code>firebaseConfig</code> into the top of <code>host-game.html</code> and <code>play.html</code> (see the comment there), then reload. Until then, use the self-paced lesson links on the Hub.</div>';
  }
  const pick=document.getElementById('pick');
  pick.innerHTML=LESSONS.map(l=>`<div class="pcard" style="--pc:${l.color}" onclick="selectLesson(${l.id})" id="pc-${l.id}">
    <div class="pc-n">Lesson ${l.id}</div><div class="pc-t">${l.icon} ${l.title}</div><div class="pc-m">${l.draw} questions · ${DUR}s each</div></div>`).join('');
}
function selectLesson(id){
  selLesson=LESSONS.find(l=>l.id===id);
  document.querySelectorAll('.pcard').forEach(c=>c.classList.remove('sel'));
  document.getElementById('pc-'+id).classList.add('sel');
  document.getElementById('create-btn').disabled=false;
}

/* build fixed deck (same for everyone) */
function buildDeck(l){
  const picked=shuffle(l.questions).slice(0,l.draw);
  return picked.map(q=>{
    const opts=q.answers.map((t,i)=>({t,ok:i===q.correct}));
    const sh=shuffle(opts);
    return {q:q.q, ex:q.explanation, opts:sh.map(o=>o.t), correct:sh.findIndex(o=>o.ok)};
  });
}

async function createGame(){
  if(!selLesson){ toast('Pick a lesson first ☝️'); return; }
  const err=ensureFirebase();
  if(err){ alert(err); return; }
  const btn=document.getElementById('create-btn'); const label=btn.textContent;
  btn.disabled=true; btn.textContent='Creating…';
  try{
    pin=(''+Math.floor(100000+Math.random()*900000));
    const deck=buildDeck(selLesson);
    gameRef=db.ref('games/'+pin);
    await gameRef.set({
      lessonId:selLesson.id, title:selLesson.title, icon:selLesson.icon, color:selLesson.color,
      deck:deck, phase:'lobby', currentQ:-1, qStart:0, duration:DUR, players:{}, createdAt:Date.now()
    });
    gameRef.onDisconnect().remove();     // auto-clean when host leaves
    gameRef.on('value',s=>{game=s.val();onGame();});
    showLobby(deck.length);
  }catch(e){
    alert('Could not create the game: '+((e&&e.message)||e)+'\n\nCommon causes: the Realtime Database has not been created in the Firebase console, the databaseURL in your config is wrong, or the database rules are not in test mode.');
    btn.disabled=false; btn.textContent=label;
  }
}
function showLobby(n){
  document.getElementById('lobby-lesson').textContent=selLesson.icon+' Lesson '+selLesson.id;
  document.getElementById('lobby-sub').textContent=selLesson.title+' · '+n+' questions';
  document.getElementById('pin-big').textContent=pin;
  const playURL=new URL('play.html',location.href).href+'?pin='+pin;
  document.getElementById('join-url').textContent=new URL('play.html',location.href).href;
  const box=document.getElementById('qr-host');box.innerHTML='';
  try{ if(typeof QRCode!=='undefined'){ new QRCode(box,{text:playURL,width:180,height:180,colorDark:'#16213e',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M}); } else throw 0; }
  catch(e){ box.innerHTML='<img width="180" height="180" alt="QR" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data='+encodeURIComponent(playURL)+'">'; }
  show('screen-lobby');
}

/* react to game state (host owns transitions but re-renders players/answers live) */
function onGame(){
  if(!game)return;
  const players=game.players||{};
  const names=Object.values(players);
  if(game.phase==='lobby'){
    document.getElementById('players-count').textContent=names.length?`${names.length} player${names.length!==1?'s':''} joined`:'Waiting for players…';
    document.getElementById('chips').innerHTML=names.map(p=>`<div class="chip">${esc(p.name)}</div>`).join('');
    document.getElementById('start-btn').disabled=names.length===0;
  }else if(game.phase==='question'){
    renderAnswered();
  }
}
function renderAnswered(){
  const players=game.players||{};const ids=Object.keys(players);
  const qi=game.currentQ;let ans=0;
  ids.forEach(id=>{const a=players[id].answers;if(a&&a[qi]!==undefined)ans++;});
  document.getElementById('q-answered').textContent=`${ans} / ${ids.length} answered`;
  if(ids.length>0 && ans>=ids.length && !revealed){ setTimeout(()=>doReveal(),400); }
}

async function startGame(){ await gotoQuestion(0); }
async function gotoQuestion(i){
  revealed=false;
  await gameRef.update({phase:'question',currentQ:i,qStart:Date.now(),duration:DUR});
  renderQuestion(i);
  startHostTimer();
}
function renderQuestion(i){
  const d=game.deck[i];const sh=['▲','●','■','◆'],cl=['A','B','C','D'];
  document.getElementById('q-idx').textContent=`Question ${i+1} / ${game.deck.length}`;
  document.getElementById('q-text').textContent=d.q;
  document.getElementById('q-tiles').innerHTML=d.opts.map((t,k)=>`<div class="tile ${cl[k]}"><span class="sh">${sh[k]}</span>${esc(t)}</div>`).join('');
  document.getElementById('q-answered').textContent='0 answered';
  show('screen-q');
}
function startHostTimer(){
  clearInterval(hostTimer);
  const el=document.getElementById('q-timer');
  function tick(){
    const left=Math.max(0,Math.ceil(DUR-(Date.now()-game.qStart)/1000));
    el.textContent=left;el.className='q-timer-circle'+(left<=5?' urgent':'');
    if(left<=0){clearInterval(hostTimer);doReveal();}
  }
  tick();hostTimer=setInterval(tick,300);
}

async function doReveal(){
  if(revealed)return;revealed=true;clearInterval(hostTimer);
  await gameRef.update({phase:'reveal'});
  renderReveal();
}
function renderReveal(){
  const i=game.currentQ,d=game.deck[i],players=game.players||{};const ids=Object.keys(players);
  const counts=[0,0,0,0];let correct=0,answered=0;
  ids.forEach(id=>{const a=players[id].answers;if(a&&a[i]!==undefined){answered++;counts[a[i].choice]++;if(a[i].ok)correct++;}});
  const rate=answered?Math.round(correct/answered*100):0;
  document.getElementById('rv-rate').textContent=rate+'%';
  document.getElementById('rv-sub').textContent=`answered correctly · ${correct} of ${answered}`;
  const sh=['▲','●','■','◆'],cl=['A','B','C','D'];const max=Math.max(1,...counts);
  document.getElementById('rv-bars').innerHTML='<div class="bars-title">How the room answered</div>'+d.opts.map((t,k)=>
    `<div class="bar-row ${k===d.correct?'correct':''}">
       <div class="bar-head">
         <div class="bar-sh ${cl[k]}">${sh[k]}</div>
         <div class="bar-label">${esc(t)}${k===d.correct?'<span class="ok">✓</span>':''}</div>
         <div class="bar-cnt">${counts[k]}</div>
       </div>
       <div class="bar-track"><div class="bar-fill ${cl[k]}" style="width:${counts[k]/max*100}%"></div></div>
     </div>`).join('');
  renderBoard('rv-board',5);
  const last=i>=game.deck.length-1;
  document.getElementById('next-btn').textContent=last?'See final podium →':'Next →';
  show('screen-reveal');
}
function sortedPlayers(){
  const players=game.players||{};
  return Object.keys(players).map(id=>({id,...players[id]})).sort((a,b)=>(b.score||0)-(a.score||0)||(a.joinedAt||0)-(b.joinedAt||0));
}
function renderBoard(elId,limit){
  const list=sortedPlayers().slice(0,limit||99);
  document.getElementById(elId).innerHTML=list.length?list.map((e,i)=>
    `<div class="lrow"><div class="rk">${i+1}</div><div class="rn">${esc(e.name)}</div><div class="rs">${(e.score||0).toLocaleString()}</div></div>`).join('')
    :'<div style="color:var(--muted);text-align:center;padding:1rem">No scores yet</div>';
}

async function nextQuestion(){
  const i=game.currentQ+1;
  if(i<game.deck.length){ await gotoQuestion(i); }
  else{ await gameRef.update({phase:'final'}); renderFinal(); }
}
function renderFinal(){
  const list=sortedPlayers();const top=list.slice(0,3);
  const order=[1,0,2],cls=['first','second','third'],md=['🥇','🥈','🥉'];
  document.getElementById('f-podium').innerHTML=top.length?order.map(idx=>{
    if(!top[idx])return '<div class="plat"></div>';const e=top[idx];
    return `<div class="plat ${cls[idx]}">${idx===0?'<div class="crown">👑</div>':''}<div class="p-av">${esc(e.name.charAt(0).toUpperCase())}</div><div class="p-nm">${esc(e.name)}</div><div class="p-sc">${(e.score||0).toLocaleString()} pts</div><div class="p-bl">${md[idx]}</div></div>`;
  }).join(''):'<div style="color:var(--muted)">No players</div>';
  document.getElementById('f-board').innerHTML=list.map((e,i)=>
    `<div class="lrow"><div class="rk">${i+1}</div><div class="rn">${esc(e.name)}</div><div class="rs">${(e.score||0).toLocaleString()}</div></div>`).join('');
  show('screen-final');
}

function cancelGame(){ if(gameRef){gameRef.remove();} location.reload(); }
window.addEventListener('beforeunload',()=>{if(gameRef)gameRef.remove();});
initSetup();
</script>
