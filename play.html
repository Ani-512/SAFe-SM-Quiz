<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join the Quiz — SAFe SM</title>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap');
  :root{--bg:#1a1a2e;--surface:#16213e;--card:#0f3460;--accent:#e94560;--yellow:#f5a623;--green:#2ecc71;--red:#e74c3c;--muted:#a0aec0;--white:#fff;--gold:#ffd700;--silver:#c0c0c0;--bronze:#cd7f32;--a:#e21b3c;--b:#1368ce;--c:#26890c;--d:#ffa602}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Nunito Sans',sans-serif;background:var(--bg);color:#fff;min-height:100vh;overflow-x:hidden}
  h1,h2,h3,.n{font-family:'Nunito',sans-serif}
  .screen{display:none;min-height:100vh}
  .screen.active{display:flex;flex-direction:column}
  .btn{display:inline-block;padding:.85rem 2rem;border-radius:50px;border:none;cursor:pointer;font-family:'Nunito';font-weight:800;font-size:1rem;transition:all .15s;margin:.25rem;text-decoration:none;color:#fff}
  .btn:hover{transform:scale(1.04)}
  .btn-primary{background:var(--accent)}
  .btn-secondary{background:var(--surface);border:2px solid rgba(255,255,255,.2)}
  .btn-yellow{background:var(--yellow);color:#1a1a2e}
  .btn-green{background:var(--green)}
  .setup-warn{max-width:560px;margin:2rem auto;background:rgba(233,69,96,.12);border:1px solid var(--accent);border-radius:14px;padding:1.25rem 1.5rem;color:#ffd7de;font-size:.9rem;line-height:1.6}
  .setup-warn code{background:rgba(0,0,0,.3);padding:.1rem .4rem;border-radius:4px}
  .toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(90px);background:var(--card);padding:.75rem 1.5rem;border-radius:10px;font-weight:700;font-size:.9rem;transition:transform .3s;z-index:999;border-left:4px solid var(--green)}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
  @media(max-width:560px){.tiles{grid-template-columns:1fr 1fr}}
  .tile{display:flex;align-items:center;gap:1rem;padding:1.2rem 1.4rem;border-radius:14px;border:none;color:#fff;font-family:'Nunito';font-weight:800;font-size:1.05rem;text-align:left;cursor:pointer;transition:all .12s;min-height:84px;word-break:break-word}
  .tile:hover:not(:disabled){filter:brightness(1.08);transform:scale(1.01)}
  .tile:disabled{cursor:default}
  .tile.A{background:var(--a)}.tile.B{background:var(--b)}.tile.C{background:var(--c)}.tile.D{background:var(--d);color:#1a1a2e}
  .tile .sh{width:40px;height:40px;flex-shrink:0;border-radius:8px;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:900}
  .tile.dim{opacity:.35}
  .tile.right{outline:5px solid var(--green);filter:brightness(1.12)}

  .center{align-items:center;justify-content:center;padding:1.5rem;text-align:center}
  #screen-join{background:linear-gradient(135deg,#1a1a2e,#0f3460)}
  .badge{background:var(--accent);color:#fff;font-family:'Nunito';font-weight:900;font-size:.75rem;padding:.35rem 1rem;border-radius:20px;display:inline-block;margin-bottom:1.25rem;letter-spacing:2px;text-transform:uppercase}
  h1.big{font-size:2rem;font-weight:900;margin-bottom:.4rem}
  .sub{color:var(--muted);margin-bottom:1.5rem}
  .inp{width:100%;max-width:340px;padding:1rem 1.25rem;border-radius:14px;border:3px solid rgba(255,255,255,.15);background:var(--surface);color:#fff;font-size:1.1rem;font-family:'Nunito';font-weight:700;text-align:center;margin-bottom:1rem;outline:none}
  .inp:focus{border-color:var(--accent)}
  .inp.pin{letter-spacing:.4rem}
  .waitbox{max-width:420px}
  .big-emoji{font-size:4rem;margin-bottom:1rem}
  .status{font-family:'Nunito';font-weight:800;font-size:1.3rem;margin-bottom:.5rem}
  .status2{color:var(--muted)}
  #screen-play{background:var(--bg);padding:0}
  .p-top{background:var(--surface);padding:.85rem 1.25rem;display:flex;justify-content:space-between;align-items:center}
  .p-you{font-weight:800}
  .p-score{background:var(--card);padding:.35rem .9rem;border-radius:16px;font-family:'Nunito';font-weight:800;font-size:.9rem}
  .tbar-wrap{height:8px;background:rgba(255,255,255,.1)}
  .tbar{height:100%;background:linear-gradient(90deg,var(--green),var(--yellow));transition:width .3s linear}
  .tbar.urgent{background:linear-gradient(90deg,var(--red),var(--accent))}
  .p-qtext{font-family:'Nunito';font-weight:800;font-size:1.15rem;line-height:1.4;text-align:center;padding:1.25rem 1.5rem}
  .p-tiles{padding:0 1rem 1.5rem}
  .p-tiles .tiles{gap:.75rem}
  .locked{text-align:center;padding:2rem 1.5rem}
  .locked .big-emoji{font-size:3rem}
  #screen-pres{background:radial-gradient(ellipse at top,#243b6b,#0e1428 65%)}
  .rv-emoji{font-size:4rem;margin-bottom:.75rem}
  .rv-big{font-family:'Nunito';font-weight:900;font-size:1.6rem;margin-bottom:.3rem}
  .rv-pts{color:var(--yellow);font-weight:800;font-size:1.1rem;margin-bottom:.5rem}
  .rv-rank{background:var(--surface);border-radius:14px;padding:1rem 1.5rem;font-weight:700;display:inline-block;margin-top:.5rem}
  .rv-rank b{font-family:'Nunito';color:var(--accent);font-size:1.3rem}
  .podium{display:flex;justify-content:center;align-items:flex-end;gap:.6rem;min-height:240px;max-width:420px;margin:1.5rem auto}
  .plat{flex:1;max-width:130px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
  .p-av{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Nunito';font-weight:900;font-size:1.3rem;color:#1a1a2e;margin-bottom:.4rem;border:3px solid rgba(255,255,255,.3)}
  .p-nm{font-family:'Nunito';font-weight:800;font-size:.85rem;text-align:center;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .p-sc{color:var(--yellow);font-weight:700;font-size:.75rem;margin-bottom:.4rem}
  .p-bl{width:100%;border-radius:10px 10px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:.6rem;font-family:'Nunito';font-weight:900;font-size:1.5rem;color:rgba(255,255,255,.9)}
  .first .p-av{background:var(--gold)}.first .p-bl{background:linear-gradient(180deg,var(--gold),#b8860b);height:150px}
  .second .p-av{background:var(--silver)}.second .p-bl{background:linear-gradient(180deg,var(--silver),#808080);height:110px}
  .third .p-av{background:var(--bronze)}.third .p-bl{background:linear-gradient(180deg,var(--bronze),#8b5a2b);height:80px}
</style>
</head>
<body>

<div id="screen-join" class="screen active center">
  <div class="badge">SAFe® Scrum Master · Live</div>
  <h1 class="big">Join the Quiz</h1>
  <p class="sub">Enter the game PIN from the host screen</p>
  <div id="fb-warn"></div>
  <input class="inp pin" id="pin-inp" inputmode="numeric" maxlength="6" placeholder="PIN" autocomplete="off">
  <input class="inp" id="name-inp" maxlength="24" placeholder="Your name" autocomplete="off">
  <button class="btn btn-primary" style="font-size:1.05rem;padding:.9rem 2.6rem" onclick="joinGame()">Join 🚀</button>
</div>

<div id="screen-wait" class="screen center">
  <div class="waitbox">
    <div class="big-emoji" id="wait-emoji">✅</div>
    <div class="status" id="wait-status">You're in!</div>
    <div class="status2" id="wait-sub">Waiting for the host to start…</div>
  </div>
</div>

<div id="screen-play" class="screen">
  <div class="p-top"><div class="p-you" id="play-name">You</div><div class="p-score">⭐ <span id="play-score">0</span></div></div>
  <div class="tbar-wrap"><div class="tbar" id="p-tbar"></div></div>
  <div class="p-qtext" id="p-qtext"></div>
  <div class="p-tiles"><div class="tiles" id="p-tiles"></div></div>
  <div class="locked" id="p-locked" style="display:none">
    <div class="big-emoji">🔒</div>
    <div class="status">Answer locked in!</div>
    <div class="status2">Look up at the big screen 👀</div>
  </div>
</div>

<div id="screen-pres" class="screen center">
  <div id="pres-inner"></div>
</div>

<script>
/* ═══════════ FIREBASE CONFIG (required for live multiplayer) ═══════════
   One-time setup (free, ~5 min):
   1. Go to https://console.firebase.google.com  →  Add project
   2. Build → Realtime Database → Create database → Start in TEST MODE
   3. Project settings (gear) → Your apps → Web app (</>) → register
   4. Copy the firebaseConfig object it gives you over the one below
      (make sure databaseURL is included).
   The SAME config goes in BOTH host-game.html and play.html. */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBUjsot15FuYuB2or9XklqF3H_-Bnxi9YE",
  authDomain: "safe-quiz-20238.firebaseapp.com",
  databaseURL: "https://safe-quiz-20238-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "safe-quiz-20238",
  storageBucket: "safe-quiz-20238.firebasestorage.app",
  messagingSenderId: "728130638190",
  appId: "1:728130638190:web:6f9ae15944ad6c2b6d317f",
  measurementId: "G-F63L91MNJV"
};

let db=null, fbReady=false;
function configLooksSet(){const c=FIREBASE_CONFIG||{};return !!(c.apiKey&&c.databaseURL&&c.apiKey.indexOf('PASTE')<0&&c.databaseURL.indexOf('PASTE')<0);}
function ensureFirebase(){
  if(fbReady)return '';
  if(typeof firebase==='undefined')return "Firebase didn't load — check your internet connection, then reload the page.";
  if(!configLooksSet())return "This page isn't set up yet. It needs the same firebaseConfig as the host page (pasted into the top of play.html).";
  try{ if(!firebase.apps||!firebase.apps.length){firebase.initializeApp(FIREBASE_CONFIG);} db=firebase.database(); fbReady=true; return ''; }
  catch(e){ return "Firebase init error: "+((e&&e.message)||e); }
}

let pin=null, pid=null, myName="", gameRef=null, meRef=null, game=null;
let myScore=0, answeredQ=-1, ptimer=null, lastPhase="", lastQ=-1;

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

const params=new URLSearchParams(location.search);
if(params.get('pin'))document.getElementById('pin-inp').value=params.get('pin').replace(/[^0-9]/g,'').slice(0,6);
if(typeof firebase==='undefined' || !configLooksSet()){document.getElementById('fb-warn').innerHTML='<div class="setup-warn">⚙️ This page needs the same Firebase config as the host. Ask your host, or paste <code>firebaseConfig</code> into the top of <code>play.html</code>.</div>';}

async function joinGame(){
  const err=ensureFirebase();
  if(err){ alert(err); return; }
  pin=document.getElementById('pin-inp').value.replace(/[^0-9]/g,'').slice(0,6);
  myName=document.getElementById('name-inp').value.trim().slice(0,24);
  if(pin.length<6){alert('Enter the 6-digit PIN');return;}
  if(!myName){alert('Enter your name');return;}
  try{
    gameRef=db.ref('games/'+pin);
    const snap=await gameRef.get();
    if(!snap.exists()){alert('Game not found. Check the PIN with your host.');return;}
  }catch(e){ alert('Could not connect: '+((e&&e.message)||e)); return; }
  pid=Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  meRef=gameRef.child('players/'+pid);
  await meRef.set({name:myName,score:0,joinedAt:Date.now(),answers:{}});
  meRef.onDisconnect().remove();
  document.getElementById('play-name').textContent=myName;
  gameRef.on('value',s=>{game=s.val();onGame();});
  show('screen-wait');
}

function onGame(){
  if(!game){alert('The host ended the game.');location.reload();return;}
  const phase=game.phase, qi=game.currentQ;
  if(phase==='lobby'){ show('screen-wait'); }
  else if(phase==='question'){
    if(qi!==lastQ){ answeredQ=-1; lastQ=qi; }        // new question
    if(answeredQ===qi){ showLocked(); } else { renderQuestion(qi); }
  }
  else if(phase==='reveal'){ clearInterval(ptimer); renderReveal(qi); }
  else if(phase==='final'){ clearInterval(ptimer); renderFinal(); }
  lastPhase=phase;
}

function renderQuestion(qi){
  const d=game.deck[qi];const sh=['▲','●','■','◆'],cl=['A','B','C','D'];
  document.getElementById('play-score').textContent=myScore.toLocaleString();
  document.getElementById('p-qtext').textContent=d.q;
  document.getElementById('p-locked').style.display='none';
  document.getElementById('p-tiles').parentElement.style.display='block';
  document.getElementById('p-tiles').innerHTML=d.opts.map((t,k)=>`<button class="tile ${cl[k]}" onclick="answer(${k})"><span class="sh">${sh[k]}</span>${esc(t)}</button>`).join('');
  show('screen-play');
  startPtimer();
}
function startPtimer(){
  clearInterval(ptimer);const bar=document.getElementById('p-tbar');
  function tick(){
    const elapsed=(Date.now()-game.qStart)/1000;const left=Math.max(0,game.duration-elapsed);
    const pct=Math.max(0,left/game.duration*100);
    bar.style.width=pct+'%';bar.className='tbar'+(left<=5?' urgent':'');
    if(left<=0){clearInterval(ptimer);}
  }
  tick();ptimer=setInterval(tick,250);
}
async function answer(k){
  if(answeredQ===game.currentQ)return;
  answeredQ=game.currentQ;clearInterval(ptimer);
  const d=game.deck[game.currentQ];const ok=k===d.correct;
  const left=Math.max(0,game.duration-(Date.now()-game.qStart)/1000);
  const pts=ok?Math.round(500+(left/game.duration)*500):0;
  await meRef.child('answers/'+game.currentQ).set({choice:k,ok:ok,pts:pts});
  if(pts>0){ myScore+=pts; meRef.child('score').transaction(c=>(c||0)+pts); }
  showLocked();
}
function showLocked(){
  document.getElementById('play-score').textContent=myScore.toLocaleString();
  document.getElementById('p-tiles').parentElement.style.display='none';
  document.getElementById('p-locked').style.display='block';
  show('screen-play');
}

function myRank(){
  const players=game.players||{};
  const list=Object.keys(players).map(id=>({id,...players[id]})).sort((a,b)=>(b.score||0)-(a.score||0)||(a.joinedAt||0)-(b.joinedAt||0));
  return {rank:list.findIndex(p=>p.id===pid)+1,total:list.length};
}
function renderReveal(qi){
  const d=game.deck[qi];const me=(game.players[pid]||{}).answers||{};const my=me[qi];
  const ok=my&&my.ok;const pts=my?my.pts:0;const r=myRank();
  document.getElementById('pres-inner').innerHTML=
    `<div class="rv-emoji">${my?(ok?'🎉':'❌'):'⏰'}</div>
     <div class="rv-big">${my?(ok?'Correct!':'Not quite'):'No answer'}</div>
     <div class="rv-pts">${pts>0?('+'+pts+' pts'):'0 pts'}</div>
     <div style="color:var(--muted);max-width:340px;margin:0 auto .5rem;font-size:.9rem">${esc(d.ex||'')}</div>
     <div class="rv-rank">You're <b>#${r.rank}</b> of ${r.total} · ${myScore.toLocaleString()} pts</div>
     <div style="color:var(--muted);margin-top:1rem;font-size:.85rem">Look up at the big screen for the full standings 👀</div>`;
  show('screen-pres');
}
function renderFinal(){
  const players=game.players||{};
  const list=Object.keys(players).map(id=>({id,...players[id]})).sort((a,b)=>(b.score||0)-(a.score||0)||(a.joinedAt||0)-(b.joinedAt||0));
  const top=list.slice(0,3);const order=[1,0,2],cls=['first','second','third'],md=['🥇','🥈','🥉'];
  const r=myRank();
  const pod=top.length?order.map(idx=>{if(!top[idx])return '<div class="plat"></div>';const e=top[idx];
    return `<div class="plat ${cls[idx]}"><div class="p-av">${esc(e.name.charAt(0).toUpperCase())}</div><div class="p-nm">${esc(e.name)}</div><div class="p-sc">${(e.score||0).toLocaleString()}</div><div class="p-bl">${md[idx]}</div></div>`;}).join(''):'';
  const place=r.rank===1?'🥇 You won!':r.rank===2?'🥈 2nd place!':r.rank===3?'🥉 3rd place!':`You finished #${r.rank} of ${r.total}`;
  document.getElementById('pres-inner').innerHTML=
    `<div class="rv-big" style="font-size:2rem;margin-bottom:1rem">🏆 Final Results</div>
     <div class="podium">${pod}</div>
     <div class="rv-rank"><b>${place}</b><br><span style="color:var(--muted);font-weight:600">${myScore.toLocaleString()} points</span></div>`;
  show('screen-pres');
}

document.getElementById('name-inp').addEventListener('keydown',e=>{if(e.key==='Enter')joinGame();});
</script>
</body>
</html>
